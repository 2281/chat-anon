# Локальная инфраструктура разработки: PostgreSQL и S3-совместимое хранилище MinIO.
# Учётные данные ниже — только для локальной разработки, продакшн-значения задаются через .env.
#
# Про образ MinIO: официальные образы minio/* убраны с Docker Hub, а quay.io из данной сети
# недоступен, поэтому используем снимок bitnamilegacy/minio (образ Bitnami, прекращённый
# вместе с остальными bitnami/* на Docker Hub). Для локальной разработки достаточно;
# для продакшена следует использовать официальный quay.io/minio/minio.
services:
  postgres:
    image: postgres:17
    container_name: chat-anon-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chatanon
    ports:
      # 5432 на хосте занят системным PostgreSQL (служба Windows) — используем 5433
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatanon"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    container_name: chat-anon-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # бакет создаётся автоматически при старте контейнера (возможность образа Bitnami)
      MINIO_DEFAULT_BUCKETS: chatanon
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: chat-anon-backend:latest
    container_name: chat-anon-backend
    environment:
      # Внутри docker-сети БД доступна по имени сервиса. На хосте 5432 занят
      # системным PostgreSQL, а подключения к postgres с хоста сбрасываются
      # корпоративным перехватчиком трафика — см. AGENTS.md, раздел «Особенности окружения».
      DATABASE_URL: postgresql+asyncpg://chat:chat@postgres:5432/chatanon
      S3_INTERNAL_ENDPOINT_URL: http://minio:9000
      # presigned URL отдаются с host фронтенда: Vite проксирует /chatanon/* на MinIO,
      # браузер ходит только на localhost:5173 (CORS отсутствует, preflight не нужен)
      S3_PROXY_BASE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # код монтируется для разработки без пересборки образа
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: chat-anon-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules из именованного volume — в bind-mount лежат Windows-модули, контейнеру не подходят
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  minio-data:
  frontend-node-modules:
