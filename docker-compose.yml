# Локальная инфраструктура разработки: PostgreSQL и S3-совместимое хранилище MinIO.
# Учётные данные ниже — только для локальной разработки, продакшн-значения задаются через .env.
#
# Про образ MinIO: официальные образы minio/* убраны с Docker Hub, поэтому используем
# снимок bitnamilegacy/minio (образ Bitnami, прекращённый вместе с остальными bitnami/*
# на Docker Hub). Для локальной разработки достаточно; для продакшена следует
# использовать официальный quay.io/minio/minio.
services:
  postgres:
    image: postgres:17
    container_name: chat-anon-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chatanon
    ports:
      # используем 5433, чтобы не пересекаться с возможным локальным PostgreSQL на 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatanon"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    container_name: chat-anon-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # бакет создаётся автоматически при старте контейнера (возможность образа Bitnami)
      MINIO_DEFAULT_BUCKETS: chatanon
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: chat-anon-backend:latest
    container_name: chat-anon-backend
    environment:
      # Внутри docker-сети БД доступна по имени сервиса postgres (порт 5432 внутри сети).
      DATABASE_URL: postgresql+asyncpg://chat:chat@postgres:5432/chatanon
      S3_INTERNAL_ENDPOINT_URL: http://minio:9000
      # режим прокси (важна не пустота значения, а его наличие): presigned URL
      # отдаются относительными, Vite проксирует /chatanon/* на MinIO — медиа
      # доступны и с localhost, и с других устройств в сети (CORS не нужен)
      S3_PROXY_BASE_URL: proxy
    ports:
      - "8000:8000"
    volumes:
      # код монтируется для разработки без пересборки образа
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: chat-anon-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules из именованного volume — в bind-mount лежат Windows-модули, контейнеру не подходят
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  minio-data:
  frontend-node-modules:
